name: 12- Working with outputs

on:
    workflow_dispatch:
        inputs:
            build-status:
                type: choice
                options:
                  - success
                  - failure
                default: success

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            build-status: ${{ steps.build.outputs.build-status}}
        steps:
            - name: Print GITHUB_OUTPUT Path
              run: echo "$GITHUB_OUTPUT"
            - name: build
              id: build
              run: |
                echo "Building..."
                echo "build-status=${{ github.event.inputs.build-status }}" >> $GITHUB_OUTPUT
            - name: Additional Step
              run: |
                echo "$GITHUB_OUTPUT"
                echo "Each step has its own GITHUB_OUTPUT file, so that it doesn't get overwritten by other steps. Use the step id to reference the output in the next job."


    
    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: ${{ needs.build.outputs.build-status == 'success' }}
        steps:
            - name: Deploy
              run: echo "Deploying with build status ${{ needs.build.outputs.build-status }}"