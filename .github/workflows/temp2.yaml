name: execution-flow

on:
    workflow_dispatch:
        inputs:
            pass-unit-tests:
                type: boolean
                description: Whether unit tests will pass or not
                default: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Lint the code
              run: echo "Linting the code"
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Run unit tests
              run: echo "Running unit tests..."
            - name: Failing Tests
              if: ${{ !inputs.pass-unit-tests }}
              run: exit 1
    deploy:
        runs-on: ubuntu-latest
        needs:
            - lint
            - tests
        steps:
            - name: Deploy the application
              run: echo "Deploying the application"